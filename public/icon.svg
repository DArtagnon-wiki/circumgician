<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The app icon: a glass rune in a gilt circle, a mote of each jewel color in its bowls, on the
       night sky. Full bleed, with everything that matters inside the middle 80% (a maskable icon's
       safe zone), so the same art serves iOS, Android and the browser tab. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#40207a" />
      <stop offset="0.5" stop-color="#1b0c38" />
      <stop offset="1" stop-color="#0a0516" />
    </radialGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dc" />
      <stop offset="0.3" stop-color="#f1d48d" />
      <stop offset="0.62" stop-color="#d9b872" />
      <stop offset="1" stop-color="#9c7436" />
    </linearGradient>
    <radialGradient id="glass" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03" />
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="32%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)" />
  <g fill="#ffffff">
    <circle cx="92" cy="104" r="2.2" opacity="0.7" />
    <circle cx="420" cy="86" r="1.8" opacity="0.55" />
    <circle cx="452" cy="300" r="2" opacity="0.5" />
    <circle cx="70" cy="380" r="1.6" opacity="0.5" />
    <circle cx="398" cy="448" r="2.4" opacity="0.6" />
    <circle cx="140" cy="462" r="1.5" opacity="0.45" />
  </g>

  <!-- the circle -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#d9b872" stroke-width="18" opacity="0.25" filter="url(#soft)" />
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#gilt)" stroke-width="11" />
  <circle cx="256" cy="256" r="166" fill="none" stroke="url(#gilt)" stroke-width="2.5" opacity="0.65" />

  <!-- the rune: a glass pentagon, its star etched faintly inside -->
  <polygon points="256,128 377.7,216.4 331.2,359.6 180.8,359.6 134.3,216.4" fill="url(#glass)" stroke="url(#gilt)" stroke-width="7" stroke-linejoin="round" />
  <polygon points="256,128 331.2,359.6 134.3,216.4 377.7,216.4 180.8,359.6" fill="none" stroke="#e8cf8f" stroke-width="2" stroke-linejoin="round" opacity="0.35" />
  <circle cx="256" cy="262" r="9" fill="url(#gilt)" />

  <!-- a mote in each bowl: ruby, sapphire, amethyst, jade, amber -->
  <g filter="url(#glow)" opacity="0.9">
    <circle cx="256" cy="128" r="26" fill="#ec2a52" />
    <circle cx="377.7" cy="216.4" r="26" fill="#2f6bff" />
    <circle cx="331.2" cy="359.6" r="26" fill="#dd8bff" />
    <circle cx="180.8" cy="359.6" r="26" fill="#1fd6a0" />
    <circle cx="134.3" cy="216.4" r="26" fill="#ffb02e" />
  </g>
  <g stroke="#fff3d0" stroke-width="2.5" stroke-opacity="0.8">
    <circle cx="256" cy="128" r="21" fill="#ec2a52" />
    <circle cx="377.7" cy="216.4" r="21" fill="#2f6bff" />
    <circle cx="331.2" cy="359.6" r="21" fill="#dd8bff" />
    <circle cx="180.8" cy="359.6" r="21" fill="#1fd6a0" />
    <circle cx="134.3" cy="216.4" r="21" fill="#ffb02e" />
  </g>
  <g fill="url(#shine)">
    <circle cx="256" cy="128" r="21" />
    <circle cx="377.7" cy="216.4" r="21" />
    <circle cx="331.2" cy="359.6" r="21" />
    <circle cx="180.8" cy="359.6" r="21" />
    <circle cx="134.3" cy="216.4" r="21" />
  </g>
</svg>
